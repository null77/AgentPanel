name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:production
      # Packaging is the real integration test: it catches missing files,
      # bad manifest fields, and anything .vscodeignore would strip.
      - run: npx vsce package --out agent-panel.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: agent-panel-vsix
          path: agent-panel.vsix
